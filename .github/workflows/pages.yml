# Always-on website: https://<owner>.github.io/Gibstaapp/
#
# - Every morning: fresh weed prices (Jane, Weedmaps, Eaze; Dutchie blocks GitHub) + beer places/happy hours,
#   then publish the site with that data.
# - Andy's PC pushes its own data to the `data` branch after its 7 AM refresh. An hourly quick run merges it in
#   (newest good data per source wins), so sources that block GitHub (Dutchie) still show up.
# - On every push to main: publish the new code right away, reusing the latest data
#   (so code changes go live in ~2 minutes without waiting for a full price refresh).
# - "Run workflow" button (Actions tab): choose whether to refresh prices too.
# - A source that fails keeps its last good data.
name: Website

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 5-6 AM in San Diego: full price refresh
    - cron: '20 * * * *'   # hourly: quick merge of the PC's latest data (no scraping)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Refresh prices too (takes ~15-30 min)'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # code always comes from main; the data branch only holds JSON
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Site address comes from the repo, so renaming the account/repo or moving it to an organization keeps working.
      - name: Work out site address
        # A repo named <owner>.github.io is served at the root (https://<owner>.github.io/), others at /<repo>/.
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"; NAME="${GITHUB_REPOSITORY#*/}"
          if [ "${NAME,,}" = "$OWNER.github.io" ]; then
            echo "SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$OWNER.github.io/$NAME" >> "$GITHUB_ENV"
            echo "VITE_BASE=/$NAME/" >> "$GITHUB_ENV"
          fi
          echo "PC_DATA_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data" >> "$GITHUB_ENV"

      - name: Build website (static mode)
        run: npm run build -w web
        env:
          VITE_STATIC: '1'

      - name: Decide whether to refresh prices
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 13 * * *" ] || [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          elif curl -sf "$SITE_URL/data/weed.json" -o /dev/null || curl -sf "$PC_DATA_URL/weed.json" -o /dev/null; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"   # no data anywhere yet
          fi

      - name: Merge latest data (no scraping)
        if: steps.mode.outputs.refresh == 'false'
        working-directory: server
        run: npx tsx src/export-static.ts ../web/dist/data
        env:
          SKIP_REFRESH: '1'
          GIB_DB: ${{ runner.temp }}/snapshot.db
          PREV_URL: ${{ env.SITE_URL }}
          PC_DATA_URL: ${{ env.PC_DATA_URL }}

      - name: Install browser for scraping
        if: steps.mode.outputs.refresh == 'true'
        run: npx playwright install --with-deps chromium

      - name: Refresh prices and export data
        if: steps.mode.outputs.refresh == 'true'
        working-directory: server
        run: |
          mkdir -p data
          echo '{ "sources": { "sample": false, "dutchie": true, "jane": true, "weedmaps": true, "eaze": true }, "tunnel": false, "sourceTimeoutMs": 900000 }' > data/config.json
          npx tsx src/export-static.ts ../web/dist/data
        env:
          GIB_DB: ${{ runner.temp }}/snapshot.db
          PREV_URL: ${{ env.SITE_URL }}
          PC_DATA_URL: ${{ env.PC_DATA_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
